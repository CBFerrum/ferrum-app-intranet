id: intranet
name: Intranet
version: 0.1.12
publisher: cbferrum
summary: "Spaces for teams with their pages and links, and announcements to everyone or a space's members, acknowledged where asked"
description: README.md
categories: [productivity]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-intranet
support: https://github.com/CBFerrum/ferrum-app-intranet/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [intranet]
uninstall: ask
# Its own interface at /intranet/: the news meant for the reader, and the spaces they may see.
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: intranet
      route: intranet
      title: Intranet
      description: News for everyone or a team, and the teams' spaces
      icon: megaphone
      color: "#7c3aed"
      roles: [Intranet Editor, Intranet Member]
  shell.open:
    - {id: intranet, package: intranet, path: "intranet/e/{entity}/{id}", list: "intranet/e/{entity}"}
  shell.create:
    - {id: announcement, label: Announcement, path: intranet/e/Announcement/new, entity: Announcement}
  # What the assistant should know in Intranet's pages, and what it suggests asking there.
  shell.assistant:
    - id: intranet
      title: "Intranet"
      instructions: >-
        An IntranetSpace is a team's space with its pages and links, seen by its members (SpaceMember). An
        Announcement is Draft, Published or Archived, sent to everyone or to a space's members; AnnouncementAck
        records who acknowledged one that asks for it.
      suggestions:
        - "What was announced this week?"
        - "Which announcements have I not acknowledged?"
        - "Who has not acknowledged an announcement yet?"
